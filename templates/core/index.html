<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanderbilt Library</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">

<!-- Navbar -->
<header class="bg-slate-900 text-white shadow-md">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
        <div class="text-xl font-bold tracking-wide">
            📚 Vanderbilt Library
        </div>
        <nav class="hidden md:flex space-x-6 text-sm font-medium">
            <a href="#" class="hover:text-amber-400 transition">Home</a>
            <a href="#" class="hover:text-amber-400 transition">Catalog</a>
            <a href="#" class="hover:text-amber-400 transition">Hours</a>
            <a href="#" class="hover:text-amber-400 transition">Contact</a>
        </nav>
    </div>
</header>

<!-- Main Hero Section -->
<main class="flex-grow flex items-center justify-center px-6 py-16">
    <div class="max-w-3xl text-center">
        <h1 class="text-4xl md:text-6xl font-extrabold text-slate-900 mb-6">
            Welcome to Vanderbilt Library
        </h1>
        <p class="text-lg md:text-xl text-gray-600 mb-10 leading-relaxed">
            Your gateway to endless knowledge, research databases, and quiet study spaces. Please select your portal below to get started.
        </p>

        <!-- Action Buttons -->
        <div class="flex flex-col sm:flex-row justify-center gap-4">
            <a href="{% url "st" %}" class="bg-amber-600 hover:bg-amber-700 text-white font-semibold px-8 py-3 rounded-lg shadow-md transition transform hover:-translate-y-0.5 text-center">
                Student Login
            </a>
            <a href="#" class="bg-slate-800 hover:bg-slate-900 text-white font-semibold px-8 py-3 rounded-lg shadow-md transition transform hover:-translate-y-0.5 text-center">
                Staff Login
            </a>
        </div>
    </div>
</main>

<!-- Footer -->
<footer class="bg-slate-900 text-gray-400 text-center py-6 text-sm">
    <p>&copy; 2026 Vanderbilt Library. All rights reserved.</p>
</footer>

</body>
</html>
