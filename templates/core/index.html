{% extends 'core/base.html' %}

{% block title %}
    HOME
{% endblock %}

{% block content %}
<!-- Main Hero Section -->
<main class="flex-grow flex items-center justify-center px-6 py-16">
    <div class="max-w-3xl text-center">
        <h1 class="text-4xl md:text-6xl font-extrabold text-slate-900 mb-6">
            Welcome to Vanderbilt Library
        </h1>
        <p class="text-lg md:text-xl text-gray-600 mb-10 leading-relaxed">
            Your gateway to endless knowledge, research databases, and quiet study spaces. Please select your portal below to get started.
        </p>

        <!-- Action Buttons -->
        <div class="flex flex-col sm:flex-row justify-center gap-4">
            <a href="{% url "st-login" %}" class="bg-amber-600 hover:bg-amber-700 text-white font-semibold px-8 py-3 rounded-lg shadow-md transition transform hover:-translate-y-0.5 text-center">
                Student Login
            </a>
            <a href="{% url "lb-login" %}" class="bg-slate-800 hover:bg-slate-900 text-white font-semibold px-8 py-3 rounded-lg shadow-md transition transform hover:-translate-y-0.5 text-center">
                Staff Login
            </a>
        </div>
    </div>
</main>
{% endblock %}
