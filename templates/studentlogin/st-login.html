<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login - Vanderbilt Library</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">

<!-- Navbar (Same as Index Page) -->
<header class="bg-slate-900 text-white shadow-md">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
        <div class="text-xl font-bold tracking-wide">
            📚 Vanderbilt Library
        </div>
        <nav class="hidden md:flex space-x-6 text-sm font-medium">
            <a href="index.html" class="hover:text-amber-400 transition">Home</a>
            <a href="#" class="hover:text-amber-400 transition">Catalog</a>
            <a href="#" class="hover:text-amber-400 transition">Hours</a>
            <a href="#" class="hover:text-amber-400 transition">Contact</a>
        </nav>
    </div>
</header>

<!-- Main Login Section -->
<main class="flex-grow flex items-center justify-center px-6 py-12">
    <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md border border-gray-200">
        <!-- Header inside the card -->
        <div class="text-center mb-6">
            <h2 class="text-2xl font-bold text-slate-900">Student Portal Login</h2>
            <p class="text-sm text-gray-500 mt-1">Access your library account & resources</p>
        </div>

        <!-- Form -->
        <form action="#" method="POST" class="space-y-5">
            <!-- Email or Student ID -->
            <div>
                <label for="student-id" class="block text-sm font-medium text-gray-700 mb-1">
                    Student ID or Email
                </label>
                <input
                        type="text"
                        id="student-id"
                        name="student-id"
                        placeholder="e.g. V12345678 or name@vanderbilt.edu"
                        required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none transition"
                >
            </div>

            <!-- Password -->
            <div>
                <div class="flex justify-between items-center mb-1">
                    <label for="password" class="block text-sm font-medium text-gray-700">
                        Password
                    </label>
                    <a href="#" class="text-xs text-amber-600 hover:underline">Forgot password?</a>
                </div>
                <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="••••••••"
                        required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none transition"
                >
            </div>

            <!-- Remember Me -->
            <div class="flex items-center">
                <input
                        type="checkbox"
                        id="remember"
                        class="h-4 w-4 text-amber-600 focus:ring-amber-500 border-gray-300 rounded"
                >
                <label for="remember" class="ml-2 block text-sm text-gray-600">
                    Remember me on this device
                </label>
            </div>

            <!-- Submit Button -->
            <button
                    type="submit"
                    class="w-full bg-amber-600 hover:bg-amber-700 text-white font-semibold py-2.5 rounded-lg shadow transition transform active:scale-95"
            >
                Sign In
            </button>
        </form>

        <!-- Help text -->
        <p class="text-xs text-center text-gray-500 mt-6">
            Need help? Contact <a href="#" class="text-amber-600 hover:underline">Student IT Support</a>.
        </p>
    </div>
</main>

<!-- Footer (Same as Index Page) -->
<footer class="bg-slate-900 text-gray-400 text-center py-6 text-sm">
    <p>&copy; 2026 Vanderbilt Library. All rights reserved.</p>
</footer>

</body>
</html>
