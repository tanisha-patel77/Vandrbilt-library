{% extends 'core/base.html' %}

{% block title %}
    LIBRARIAN ACCOUNT
{% endblock %}

{% block content %}
<!-- Main Login Section -->
<main class="flex-grow flex items-center justify-center px-6 py-12">
    <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md border border-gray-200">
        <!-- Header inside the card -->
        <div class="text-center mb-6">
            <h2 class="text-2xl font-bold text-slate-900">Librarian Portal Login</h2>
            <p class="text-sm text-gray-500 mt-1">Staff Administration & Management System</p>
        </div>

        <!-- Form -->
        <form action="#" method="POST" class="space-y-5">
            {% csrf_token %}

            <!-- Staff / Librarian ID or Email -->
            <div>
                <label for="staff-id" class="block text-sm font-medium text-gray-700 mb-1">
                    Staff ID or Email
                </label>
                <input
                        type="text"
                        id="staff-id"
                        name="staff-id"
                        placeholder="e.g. L98765432 or staff@vanderbilt.edu"
                        required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-slate-800 focus:outline-none transition"
                >
            </div>

            <!-- Phone / Contact Number (Extra Field) -->
            <div>
                <label for="phone" class="block text-sm font-medium text-gray-700 mb-1">
                    Phone / Contact Number
                </label>
                <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="e.g. +1 (555) 000-0000"
                        required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-slate-800 focus:outline-none transition"
                >
            </div>

            <!-- Password -->
            <div>
                <div class="flex justify-between items-center mb-1">
                    <label for="password" class="block text-sm font-medium text-gray-700">
                        Password
                    </label>
                    <a href="#" class="text-xs text-amber-600 hover:underline">Forgot password?</a>
                </div>
                <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="••••••••"
                        required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-slate-800 focus:outline-none transition"
                >
            </div>

            <!-- Remember Me -->
            <div class="flex items-center">
                <input
                        type="checkbox"
                        id="remember"
                        class="h-4 w-4 text-slate-800 focus:ring-slate-800 border-gray-300 rounded"
                >
                <label for="remember" class="ml-2 block text-sm text-gray-600">
                    Remember me on this device
                </label>
            </div>

            <!-- Submit Button -->
            <button
                    type="submit"
                    class="w-full bg-slate-800 hover:bg-slate-900 text-white font-semibold py-2.5 rounded-lg shadow transition transform active:scale-95"
            >
                Librarian Sign In
            </button>
        </form>

        <!-- Help text -->
        <p class="text-xs text-center text-gray-500 mt-6">
            Need staff authorization? Contact <a href="#" class="text-amber-600 hover:underline">Library Systems Admin</a>.
        </p>
    </div>
</main>
{% endblock %}
